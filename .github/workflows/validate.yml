name: Validate Morphology Madness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate morpheme bank and puzzles
        run: node tests/validate-data.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test all three modes in Chromium
        run: python tests/test-browser.py
