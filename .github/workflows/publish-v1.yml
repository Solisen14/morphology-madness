name: Publish Morphology Madness v1.0 release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and publish v1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            echo "v1.0 release already exists."
          else
            gh release create v1.0 --target "$GITHUB_SHA" --title "Morphology Madness v1.0" --notes-file RELEASE_NOTES.md
          fi
